name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://pantryiq:pantryiq@localhost:5432/pantryiq
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-for-real-use
  BETTER_AUTH_URL: http://localhost:3000
  PANTRYIQ_E2E: '1'

jobs:
  smoke:
    name: Smoke (static checks and build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # This is the gate for the more expensive jobs. Once it passes, the
      # database and browser work can run on separate runners.
      - name: Smoke gate (format, typecheck, build)
        run: pnpm ci:smoke

  tests:
    name: Tests and coverage
    needs: smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pantryiq
          POSTGRES_PASSWORD: pantryiq
          POSTGRES_DB: pantryiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pantryiq -d pantryiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests and coverage
        run: pnpm ci:tests
        env:
          TEST_DATABASE_URL: postgresql://pantryiq:pantryiq@localhost:5432/pantryiq
          REQUIRE_INTEGRATION_DB: '1'

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-tests
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore

  browser:
    name: Browser (${{ matrix.suite }})
    needs: smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - suite: accessibility
            command: test:a11y
          - suite: charts
            command: test:charts
          - suite: end-to-end
            command: test:e2e
          - suite: ui
            command: test:ui
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pantryiq
          POSTGRES_PASSWORD: pantryiq
          POSTGRES_DB: pantryiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pantryiq -d pantryiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare browser test database
        run: pnpm db:migrate

      - name: Run ${{ matrix.suite }} browser gates
        run: pnpm ${{ matrix.command }}

      - name: Publish browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # Keep one stable required check for branch protection while the expensive
  # work above runs in parallel. A skipped or cancelled shard is a CI failure.
  ci:
    name: CI
    if: always()
    needs: [smoke, tests, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all CI jobs passed
        if: >-
          ${{
            needs.smoke.result != 'success' ||
            needs.tests.result != 'success' ||
            needs.browser.result != 'success'
          }}
        run: |
          echo "Smoke: ${{ needs.smoke.result }}"
          echo "Tests: ${{ needs.tests.result }}"
          echo "Browser: ${{ needs.browser.result }}"
          exit 1

      - name: All CI jobs passed
        run: echo "Static checks, tests, browser gates, and build passed."
