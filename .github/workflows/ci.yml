name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pantryiq
          POSTGRES_PASSWORD: pantryiq
          POSTGRES_DB: pantryiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pantryiq -d pantryiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pantryiq:pantryiq@localhost:5432/pantryiq
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-for-real-use
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every stage below runs one of the ci:* scripts from package.json, so
      # `pnpm ci` locally covers the same ground as this workflow. The split
      # into separate steps is only for readable logs and per-step env.
      # tests/ci-parity.test.ts fails the build if the two ever drift.

      - name: Static checks (format, typecheck)
        run: pnpm ci:static

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Unit and integration tests
        run: pnpm ci:unit
        env:
          TEST_DATABASE_URL: postgresql://pantryiq:pantryiq@localhost:5432/pantryiq
          REQUIRE_INTEGRATION_DB: '1'

      - name: Prepare browser test database
        run: pnpm db:migrate

      - name: Browser gates (accessibility, charts, end-to-end)
        run: pnpm ci:browser

      - name: Build
        run: pnpm build

      - name: Coverage report
        if: always()
        run: pnpm ci:coverage
        env:
          TEST_DATABASE_URL: postgresql://pantryiq:pantryiq@localhost:5432/pantryiq

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
