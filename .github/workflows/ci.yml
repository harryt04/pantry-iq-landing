name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pantryiq
          POSTGRES_PASSWORD: pantryiq
          POSTGRES_DB: pantryiq
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pantryiq -d pantryiq"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://pantryiq:pantryiq@localhost:5432/pantryiq
      BETTER_AUTH_SECRET: ci-placeholder-secret-not-for-real-use
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm lint

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility gate
        run: pnpm test:a11y

      - name: Greyscale chart gate
        run: pnpm test:charts

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm test:integration
        env:
          TEST_DATABASE_URL: postgresql://pantryiq:pantryiq@localhost:5432/pantryiq

      - name: Prepare browser test database
        run: pnpm db:migrate

      - name: Critical path end-to-end test
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
