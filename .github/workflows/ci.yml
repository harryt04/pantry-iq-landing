name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check (Prettier)
        run: pnpm lint

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Accessibility gate
        run: pnpm test:a11y

      - name: Greyscale chart gate
        run: pnpm test:charts

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: PostgreSQL integration tests
        run: pnpm test:integration
        env:
          TESTCONTAINERS_ENABLED: '1'

      - name: Build
        run: pnpm build
        env:
          # A placeholder is sufficient for a production build — no route
          # in this build queries the database yet. Real secrets are
          # never committed; see .env.example.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          BETTER_AUTH_SECRET: ci-placeholder-secret-not-for-real-use
          BETTER_AUTH_URL: http://localhost:3000

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            coverage/
            playwright-report/
            test-results/
          if-no-files-found: ignore
