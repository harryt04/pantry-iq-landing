services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pantryiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pantryiq}
      POSTGRES_DB: ${POSTGRES_DB:-pantryiq}
    ports:
      - '5433:5432'
    volumes:
      - pantryiq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-pantryiq}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pantryiq-postgres-data:
